name: Refresh public project evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: write
concurrency:
  group: profile-evidence
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Refresh selected public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_projects.py
      - name: Commit evidence only when changed
        run: |
          git add README.md data/projects.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh selected public project evidence'
          git push
